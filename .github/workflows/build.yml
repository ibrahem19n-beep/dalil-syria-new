name: Dalil Syria 1.4 - Damascus + Rif Dimashq Bulk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate V1.4 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -type f \
            -name 'Dalil_Syria_V1.4_DAMASCUS_RIF_BULK_READY.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V1.4 ZIP not found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP"

      - name: Extract V1.4 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Project root: $ROOT"

      - name: Locate bulk builder
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT=$(find "$PROJECT_ROOT" -type f \
            -name 'build_bulk_places.py' \
            -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "ERROR: build_bulk_places.py was not found."
            echo "Files under project:"
            find "$PROJECT_ROOT" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "BULK_SCRIPT=$SCRIPT" >> "$GITHUB_ENV"

          echo "Bulk builder found at:"
          echo "$SCRIPT"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "duckdb>=1.4.0,<1.5"

      - name: Build Damascus + Rif Dimashq bulk dataset
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_DIR=$(dirname "$BULK_SCRIPT")

          cd "$SCRIPT_DIR"

          echo "Running:"
          echo "$BULK_SCRIPT"

          python "$BULK_SCRIPT" --limit 10000

          PLACES="$PROJECT_ROOT/mobile_app/data/places.json"

          if [ ! -s "$PLACES" ]; then
            echo "ERROR: places.json was not generated."
            exit 1
          fi

          echo "Bulk dataset generated."

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          project_root = Path(os.environ["PROJECT_ROOT"])
          places_path = project_root / "mobile_app" / "data" / "places.json"

          data = json.loads(
              places_path.read_text(encoding="utf-8")
          )

          if not isinstance(data, list):
              raise SystemExit(
                  "ERROR: places.json does not contain a list."
              )

          print("FINAL_PLACE_COUNT=", len(data))

          if len(data) == 0:
              raise SystemExit(
                  "ERROR: places.json is empty."
              )

          ids = [str(x.get("id")) for x in data]

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "ERROR: duplicate place IDs found."
              )

          for x in data:
              if "latitude" not in x or "longitude" not in x:
                  raise SystemExit(
                      "ERROR: place missing coordinates."
                  )

              lat = float(x["latitude"])
              lon = float(x["longitude"])

              if not (-90 <= lat <= 90):
                  raise SystemExit(
                      "ERROR: invalid latitude."
                  )

              if not (-180 <= lon <= 180):
                  raise SystemExit(
                      "ERROR: invalid longitude."
                  )

          print("DATA_AUDIT_OK")

          PY

      - name: Copy updated data into Android assets
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf android/app/src/main/assets/mobile_app

          mkdir -p android/app/src/main/assets

          cp -a mobile_app \
            android/app/src/main/assets/mobile_app

          echo "Android data updated."

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              | head -n 1)
          fi

          if [ -z "$MANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$MANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$MANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT/android"

          touch gradle.properties

          grep -q '^android.useAndroidX=true$' \
            gradle.properties || \
            echo 'android.useAndroidX=true' \
            >> gradle.properties

          grep -q '^android.enableJetifier=true$' \
            gradle.properties || \
            echo 'android.enableJetifier=true' \
            >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT/android"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          APK=$(find "$PROJECT_ROOT/android/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" \
            apk-output/dalil-syria-v1.4-damascus-rif-debug.apk

          cp "$PROJECT_ROOT/mobile_app/data/places.json" \
            apk-output/places.json

          sha256sum apk-output/* \
            > apk-output/SHA256SUMS.txt

          echo "FINAL ARTIFACTS:"
          ls -lh apk-output

      - name: Upload APK and data
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-v1.4-damascus-rif
          path: apk-output/*
          if-no-files-found: error
