name: Dalil Syria - Real UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and locate project
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/v14"

          unzip -q \
            "$GITHUB_WORKSPACE/.github/workflows/Dalil_Syria_V1.4_DAMASCUS_RIF_BULK_READY.zip" \
            -d "$GITHUB_WORKSPACE/v14"

          V14_ROOT=$(find "$GITHUB_WORKSPACE/v14" \
            -type f \
            -name settings.gradle \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$V14_ROOT" ]; then
            echo "ERROR: V1.4 project not found."
            exit 1
          fi

          echo "V14_ROOT=$V14_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/clean"

          unzip -q \
            "$GITHUB_WORKSPACE/Dalil_Syria_CLEAN_INSTALL_V1.2.1.zip" \
            -d "$GITHUB_WORKSPACE/clean"

          CLEAN_MOBILE=$(find "$GITHUB_WORKSPACE/clean" \
            -type f \
            -name index.html \
            -path '*/mobile_app/*' \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$CLEAN_MOBILE" ]; then
            echo "ERROR: clean mobile_app not found."
            exit 1
          fi

          echo "CLEAN_MOBILE=$CLEAN_MOBILE" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install duckdb
          npm install -g http-server
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Build and validate all places
        shell: bash
        run: |
          set -e

          SCRIPT=$(find "$GITHUB_WORKSPACE/v14" \
            -type f \
            -name 'build_bulk_places.py' \
            -print \
            -quit || true)

          if [ -n "$SCRIPT" ]; then
            echo "Using builder: $SCRIPT"
            python "$SCRIPT" --limit 100000
          else
            echo "Builder script not included; using existing places.json."

            SRC=$(find "$V14_ROOT" \
              -type f \
              -path '*/mobile_app/data/places.json' \
              -print \
              -quit || true)

            if [ -z "$SRC" ]; then
              SRC=$(find "$V14_ROOT" \
                -type f \
                -name 'places.json' \
                -print \
                -quit || true)
            fi

            if [ -z "$SRC" ]; then
              echo "ERROR: no places.json found."
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/mobile_app/data"
            cp "$SRC" \
              "$GITHUB_WORKSPACE/mobile_app/data/places.json"
          fi

          PLACES=$(find "$GITHUB_WORKSPACE/v14" \
            -type f \
            -name 'places.json' \
            -print \
            -quit || true)

          if [ -z "$PLACES" ]; then
            PLACES=$(find "$V14_ROOT" \
              -type f \
              -name 'places.json' \
              -print \
              -quit || true)
          fi

          if [ -z "$PLACES" ]; then
            echo "ERROR: places.json missing after build."
            exit 1
          fi

          cp "$PLACES" "$GITHUB_WORKSPACE/places.json"

          python - <<'PY'
          import json

          p="places.json"

          with open(p,"r",encoding="utf-8") as f:
              data=json.load(f)

          if isinstance(data,dict):
              places=data.get("places",[])
          else:
              places=data

          if not isinstance(places,list):
              raise SystemExit("places.json is not a list")

          print("Original places:",len(places))

          if len(places)<1:
              raise SystemExit("No places found")

          with open("places_audit.json","w",encoding="utf-8") as f:
              json.dump(
                  {
                      "original":len(places),
                      "removed":0,
                      "final":len(places)
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Final places:",len(places))
          PY

      - name: Install clean UI and bundle local map
        shell: bash
        run: |
          set -e

          APP="$GITHUB_WORKSPACE/$V14_ROOT/mobile_app"
          MAP_DIR="$RUNNER_TEMP/maplibre"

          rm -rf "$V14_ROOT/mobile_app"

          cp -a \
            "$CLEAN_MOBILE" \
            "$V14_ROOT/mobile_app"

          cp \
            "$GITHUB_WORKSPACE/places.json" \
            "$APP/data/places.json"

          cp \
            "$GITHUB_WORKSPACE/places_audit.json" \
            "$APP/data/places_audit.json"

          rm -rf "$MAP_DIR"

          mkdir -p "$MAP_DIR"

          cd "$MAP_DIR"

          npm init -y >/dev/null 2>&1

          npm install \
            --silent \
            maplibre-gl@4.7.1

          MAP_JS=$(find \
            "$MAP_DIR/node_modules/maplibre-gl" \
            -type f \
            \( \
              -name 'maplibre-gl.js' \
              -o \
              -name 'maplibre-gl.min.js' \
            \) \
            -print \
            -quit)

          MAP_CSS=$(find \
            "$MAP_DIR/node_modules/maplibre-gl" \
            -type f \
            -name 'maplibre-gl.css' \
            -print \
            -quit)

          test -n "$MAP_JS"
          test -n "$MAP_CSS"

          mkdir -p "$APP/vendor"

          cp \
            "$MAP_JS" \
            "$APP/vendor/maplibre-gl.js"

          cp \
            "$MAP_CSS" \
            "$APP/vendor/maplibre-gl.css"

          cp \
            "$APP/data/places.json" \
            "$GITHUB_WORKSPACE/places.json"

          cp \
            "$APP/data/places_audit.json" \
            "$GITHUB_WORKSPACE/places_audit.json"

      - name: Add real app layer
        shell: bash
        run: |
          set -e

          APP="$V14_ROOT/mobile_app"

          test -f "$APP/index.html"
          test -f "$APP/app.js"
          test -f "$APP/styles.css"
          test -f "$APP/data/places.json"
          test -f "$APP/vendor/maplibre-gl.js"
          test -f "$APP/vendor/maplibre-gl.css"

          echo "Real app layer verified."

      - name: Copy into Android assets
        shell: bash
        run: |
          set -e

          ASSETS="$V14_ROOT/app/src/main/assets/mobile_app"

          rm -rf "$ASSETS"

          mkdir -p "$ASSETS"

          cp -a \
            "$V14_ROOT/mobile_app/." \
            "$ASSETS/"

          test -f "$ASSETS/index.html"
          test -f "$ASSETS/app.js"
          test -f "$ASSETS/styles.css"
          test -f "$ASSETS/data/places.json"
          test -f "$ASSETS/vendor/maplibre-gl.js"
          test -f "$ASSETS/vendor/maplibre-gl.css"

          echo "Android assets ready."

      - name: Runtime browser test
        shell: bash
        run: |
          set -e

          cd "$V14_ROOT/mobile_app"

          python -m http.server 8765 \
            > "$RUNNER_TEMP/http.log" 2>&1 &

          SERVER_PID=$!

          trap "kill $SERVER_PID || true" EXIT

          sleep 3

          cat > "$RUNNER_TEMP/test.js" <<'NODE'
          const {chromium}=require('playwright');

          (async()=>{
            const b=await chromium.launch({
              headless:true
            });

            const p=await b.newPage();

            const err=[];

            p.on(
              'pageerror',
              e=>err.push(e.message)
            );

            await p.goto(
              'http://127.0.0.1:8765/index.html',
              {
                waitUntil:'domcontentloaded',
                timeout:60000
              }
            );

            await p.waitForTimeout(1500);

            const n=await p.evaluate(
              ()=>Array.isArray(window.DALIL_PLACES)
                ?window.DALIL_PLACES.length
                :0
            );

            if(n<1)
              throw Error('places not loaded');

            if(
              await p.evaluate(
                ()=>typeof window.maplibregl!=='object'
              )
            )
              throw Error('MapLibre not loaded');

            if(
              await p
                .locator('#categoriesGrid button')
                .count()<1
            )
              throw Error('categories missing');

            await p
              .locator('#categoriesGrid button')
              .first()
              .click();

            await p.waitForTimeout(300);

            if(
              await p
                .locator('.realCard')
                .count()<1
            )
              throw Error('category interaction failed');

            await p
              .locator('#langToggle')
              .click();

            if(
              await p
                .locator('html')
                .getAttribute('dir')
              !=='ltr'
            )
              throw Error('English switch failed');

            if(err.length)
              throw Error(err.join('\n'));

            console.log(
              'RUNTIME_OK places='+n
            );

            await b.close();

          })().catch(e=>{
            console.error(
              e.stack||e
            );

            process.exit(1);
          })
          NODE

          node "$RUNNER_TEMP/test.js"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$V14_ROOT"

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Align and sign APK
        shell: bash
        run: |
          set -e

          APK=$(find "$V14_ROOT" \
            -type f \
            -name '*debug*.apk' \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            APK=$(find "$V14_ROOT" \
              -type f \
              -name '*.apk' \
              -print \
              -quit)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          UNSIGNED="$GITHUB_WORKSPACE/release/dalil-syria-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/release/dalil-syria-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/release/dalil-syria.apk"

          cp "$APK" "$UNSIGNED"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          keytool \
            -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/dalil-release.jks" \
            -storepass android \
            -keypass android \
            -alias dalilsyria \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Dalil Syria,O=Dalil Syria,C=SY"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/dalil-release.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias dalilsyria \
            --out "$FINAL" \
            "$ALIGNED"

          "$APKSIGNER" verify \
            --verbose \
            "$FINAL"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$FINAL"

          ls -lh "$FINAL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-final-apk
          path: release/dalil-syria.apk
          if-no-files-found: error
