name: دليل سوريا 1.4 - دمشق + ريف دمشق Bulk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: CHECKOUT
        uses: actions/checkout@v4

      - name: FIND AND EXTRACT V1.4
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$(find . -type f -name 'Dalil_Syria_V1.4_DAMASCUS_RIF_BULK_READY.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: V1.4 ZIP NOT FOUND"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "FOUND ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "EXTRACTED FILES:"
          find project -maxdepth 5 -type f | sort | head -300

      - name: AUTO LOCATE BUILD SCRIPT
        shell: bash
        run: |
          set -Eeuo pipefail

          SCRIPT="$(find project -type f -name 'build_bulk_places.py' -print -quit)"

          if [ -z "$SCRIPT" ]; then
            echo "ERROR: build_bulk_places.py NOT FOUND ANYWHERE"
            find project -type f | sort
            exit 1
          fi

          SCRIPT_DIR="$(dirname "$SCRIPT")"

          echo "BUILD SCRIPT FOUND:"
          echo "$SCRIPT"

          echo "SCRIPT DIRECTORY:"
          echo "$SCRIPT_DIR"

          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "SCRIPT_DIR=$SCRIPT_DIR" >> "$GITHUB_ENV"

      - name: AUTO LOCATE ANDROID PROJECT
        shell: bash
        run: |
          set -Eeuo pipefail

          SETTINGS="$(find project -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings file NOT FOUND"
            find project -type f | sort
            exit 1
          fi

          ANDROID_ROOT="$(dirname "$SETTINGS")"

          echo "ANDROID PROJECT:"
          echo "$ANDROID_ROOT"

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: SETUP PYTHON
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: INSTALL PYTHON DEPENDENCIES
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "duckdb>=1.4.0,<1.5" \
            pandas \
            pyarrow

      - name: BUILD BULK DATA AUTO
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "RUNNING:"
          echo "$SCRIPT"

          cd "$SCRIPT_DIR"

          python build_bulk_places.py --limit 10000

      - name: LOCATE GENERATED PLACES JSON
        shell: bash
        run: |
          set -Eeuo pipefail

          PLACES="$(find "$ANDROID_ROOT/.." -type f -path '*/mobile_app/data/places.json' -print -quit)"

          if [ -z "$PLACES" ]; then
            PLACES="$(find project -type f -name 'places.json' -print -quit)"
          fi

          if [ -z "$PLACES" ]; then
            echo "ERROR: places.json NOT GENERATED"
            find project -type f | sort
            exit 1
          fi

          echo "PLACES FILE:"
          echo "$PLACES"

          echo "PLACES=$PLACES" >> "$GITHUB_ENV"

      - name: AUDIT DATA
        shell: bash
        run: |
          set -Eeuo pipefail

          python - "$PLACES" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("ERROR: places.json is not a list")

          print("FINAL_PLACE_COUNT =", len(data))

          if len(data) == 0:
              raise SystemExit("ERROR: ZERO PLACES")

          ids = [str(x.get("id")) for x in data]

          if len(ids) != len(set(ids)):
              raise SystemExit("ERROR: DUPLICATE IDS")

          for x in data:
              float(x["latitude"])
              float(x["longitude"])

          print("DATA_AUDIT_OK")
          PY

      - name: COPY DATA INTO ANDROID ASSETS
        shell: bash
        run: |
          set -Eeuo pipefail

          MOBILE="$(dirname "$(dirname "$PLACES")")"

          if [ ! -d "$MOBILE" ]; then
            echo "ERROR: mobile_app directory not found"
            exit 1
          fi

          rm -rf "$ANDROID_ROOT/app/src/main/assets/mobile_app"

          mkdir -p "$ANDROID_ROOT/app/src/main/assets"

          cp -a "$MOBILE" \
            "$ANDROID_ROOT/app/src/main/assets/mobile_app"

          echo "ANDROID ASSETS UPDATED"

      - name: CONFIGURE ANDROID SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              -print -quit)"
          fi

          test -n "$MANAGER"

          yes | "$MANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$MANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: SETUP GRADLE
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: CONFIGURE ANDROIDX
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$ANDROID_ROOT"

          touch gradle.properties

          grep -q '^android.useAndroidX=true$' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=true$' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

      - name: BUILD APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$ANDROID_ROOT"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: COLLECT RESULTS
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p apk-output

          APK="$(find "$ANDROID_ROOT/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT GENERATED"
            exit 1
          fi

          cp "$APK" \
            apk-output/dalil-syria-v1.4-damascus-rif-debug.apk

          cp "$PLACES" \
            apk-output/places.json

          sha256sum apk-output/* \
            > apk-output/SHA256SUMS.txt

          echo "================================"
          echo "BUILD SUCCESS"
          echo "================================"

          ls -lh apk-output

      - name: UPLOAD RESULTS
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-v1.4-damascus-rif
          path: apk-output/*
          if-no-files-found: error
