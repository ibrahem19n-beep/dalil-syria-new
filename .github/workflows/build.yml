name: Dalil Syria - Production APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract projects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v14 clean
          mkdir -p v14 clean
          unzip -q .github/workflows/Dalil_Syria_V1.4_DAMASCUS_RIF_BULK_READY.zip -d v14
          unzip -q Dalil_Syria_CLEAN_INSTALL_V1.2.1.zip -d clean
          SETTINGS=$(find v14 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS"
          echo "V14_ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "CLEAN_MOBILE=$(find clean -type d -path '*/mobile_app' -print -quit)" >> "$GITHUB_ENV"

      - name: Setup Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare places
        shell: bash
        run: |
          set -euo pipefail
          cd "$V14_ROOT"
          SCRIPT=$(find "$GITHUB_WORKSPACE/v14" -type f -name build_bulk_places.py -print -quit || true)
          if [ -n "$SCRIPT" ]; then
            python "$SCRIPT" --limit 100000
          else
            SRC=$(find . -type f -path '*/mobile_app/data/places.json' -print -quit || true)
            [ -n "$SRC" ] || SRC=$(find . -type f -name places.json -print -quit || true)
            test -n "$SRC"
            mkdir -p mobile_app/data
            cp "$SRC" mobile_app/data/places.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mobile_app/data/places.json')
          a=json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(a,list) or not a: raise SystemExit('Invalid places.json')
          req=['id','name_ar','name_en','category_ar','category_en','latitude','longitude']
          good=[]; ids=set(); bad=[]
          for i,x in enumerate(a):
              try:
                  if not isinstance(x,dict): raise ValueError('not object')
                  m=[k for k in req if x.get(k) is None or not str(x.get(k)).strip()]
                  if m: raise ValueError('missing:'+','.join(m))
                  pid=str(x['id']).strip()
                  if pid in ids: raise ValueError('duplicate id')
                  lat=float(x['latitude']); lon=float(x['longitude'])
                  if not -90<=lat<=90 or not -180<=lon<=180: raise ValueError('bad coordinates')
                  ids.add(pid); good.append(x)
              except Exception as e:
                  bad.append({'index':i,'reason':str(e)})
          if not good: raise SystemExit('No valid places')
          p.write_text(json.dumps(good,ensure_ascii=False),encoding='utf-8')
          Path('mobile_app/data/places_audit.json').write_text(json.dumps({'original_count':len(a),'removed_count':len(bad),'final_valid_count':len(good),'removed':bad},ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_VALID_PLACE_COUNT=',len(good))
          PY
          cp mobile_app/data/places.json "$GITHUB_WORKSPACE/places.json"
          cp mobile_app/data/places_audit.json "$GITHUB_WORKSPACE/places_audit.json"

      - name: Install clean UI and local MapLibre
        shell: bash
        run: |
          set -euo pipefail
          APP="$V14_ROOT/mobile_app"
          rm -rf "$APP"
          cp -a "$CLEAN_MOBILE" "$APP"
          cp "$GITHUB_WORKSPACE/places.json" "$APP/data/places.json"
          cp "$GITHUB_WORKSPACE/places_audit.json" "$APP/data/places_audit.json"
          mkdir -p "$APP/vendor"
          TMP="$RUNNER_TEMP/map"
          mkdir -p "$TMP"
          cd "$TMP"
          npm init -y >/dev/null 2>&1
          npm install --silent maplibre-gl@4.7.1
          JS=$(find node_modules/maplibre-gl -type f \( -name maplibre-gl.js -o -name maplibre-gl.min.js \) -print -quit)
          CSS=$(find node_modules/maplibre-gl -type f -name maplibre-gl.css -print -quit)
          test -n "$JS"; test -n "$CSS"
          cp "$JS" "$APP/vendor/maplibre-gl.js"
          cp "$CSS" "$APP/vendor/maplibre-gl.css"
          python - "$APP/index.html" <<'PY'
          from pathlib import Path
          import sys,re
          p=Path(sys.argv[1]); h=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="vendor/maplibre-gl.css">'
          js='<script src="vendor/maplibre-gl.js"></script><script src="data/places.js"></script>'
          if 'vendor/maplibre-gl.js' not in h:
              m=re.search(r'<script[^>]+src=["\'][^"\']*app\.js[^"\']*["\'][^>]*>\s*</script>',h,re.I)
              if not m: raise SystemExit('app.js script not found')
              h=h[:m.start()]+css+js+h[m.start():]
          p.write_text(h,encoding='utf-8')
          Path(p.parent/'data/places.js').write_text('window.DALIL_PLACES='+Path(p.parent/'data/places.json').read_text(encoding='utf-8')+';',encoding='utf-8')
          PY

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd "$V14_ROOT/mobile_app"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null 2>&1
                    python -m http.server 8765 --bind 127.0.0.1 >/tmp/dalil-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const errors=[];
            p.on('pageerror',e=>errors.push(e.stack||e.message));
            await p.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(2000);
            const n=await p.evaluate(()=>Array.isArray(window.DALIL_PLACES)?window.DALIL_PLACES.length:0);
            if(n<1) throw Error('places not loaded');
            if(await p.evaluate(()=>typeof window.maplibregl!=='object')) throw Error('MapLibre not loaded');
            if(await p.locator('#categoriesGrid button').count()<1) throw Error('categories missing');
            if(await p.locator('#langToggle').count()<1) throw Error('language control missing');
            if(errors.length) throw Error(errors.join('\n\n'));
            console.log('BROWSER_OK places='+n);
            await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and validate APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          cd "$V14_ROOT"
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          gradle assembleDebug --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$SDK/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 23 "$APK"
          PKG=$("$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test -n "$PKG"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/dalil-syria-production-debug.apk"
          cp mobile_app/data/places.json "$GITHUB_WORKSPACE/apk-output/places.json"
          cp mobile_app/data/places_audit.json "$GITHUB_WORKSPACE/apk-output/places_audit.json"
          sha256sum "$GITHUB_WORKSPACE/apk-output/dalil-syria-production-debug.apk" > "$GITHUB_WORKSPACE/apk-output/SHA256SUMS.txt"
          echo "APK_PATH=$GITHUB_WORKSPACE/apk-output/dalil-syria-production-debug.apk" >> "$GITHUB_ENV"
          echo "APK_PACKAGE=$PKG" >> "$GITHUB_ENV"

      - name: Android 11 install and launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$APK_PATH"
            adb shell am force-stop "$APK_PACKAGE" || true
            adb shell monkey -p "$APK_PACKAGE" 1 >/dev/null
            sleep 8
            PID=$(adb shell pidof "$APK_PACKAGE" | tr -d '\r' || true)
            if [ -z "$PID" ]; then
              adb logcat -d -t 300 | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: ' || true
              exit 1
            fi
            echo "ANDROID11_INSTALL_LAUNCH_OK package=$APK_PACKAGE pid=$PID"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-production
          path: apk-output/*
          if-no-files-found: error
