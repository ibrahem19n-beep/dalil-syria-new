name: Dalil Syria Clean APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android components
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)
          fi

          test -n "$MANAGER"

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true

          "$MANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and Extract Clean ZIP
        shell: bash
        run: |
          ZIP_NAME="Dalil_Syria_CLEAN_INSTALL_V1.2.0.zip"

          ZIP_PATH=$(find . -type f -name "$ZIP_NAME" -print -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: Clean ZIP file not found: $ZIP_NAME"
            echo "Files in repository:"
            find . -maxdepth 5 -type f | sort | head -n 300
            exit 1
          fi

          echo "Found clean ZIP: $ZIP_PATH"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_PATH" -d extracted

      - name: Locate Android Project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project was not found."
            find extracted -maxdepth 6 -type f | sort | head -n 400
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        shell: bash
        run: |
          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Verify Clean App Assets
        shell: bash
        run: |
          echo "Checking clean release assets..."

          test -f "$PROJECT_DIR/app/src/main/assets/index.html" || \
          test -f "$PROJECT_DIR/app/src/main/assets/www/index.html" || \
          true

          echo "Android project verification completed."

      - name: Configure AndroidX
        shell: bash
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'android.nonTransitiveRClass=true' \
            > "$PROJECT_DIR/gradle.properties"

      - name: Build Clean APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          test -s "$APK"

          echo "APK found: $APK"

          cp "$APK" "$GITHUB_WORKSPACE/dalil-syria-clean-v1.2.0.apk"

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-clean-v1.2.0-apk
          path: dalil-syria-clean-v1.2.0.apk
          retention-days: 14
