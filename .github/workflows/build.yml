name: Dalil Syria - Real UI Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract projects
        shell: bash
        run: |
          set -e
          rm -rf v14 clean
          mkdir -p v14 clean

          unzip -q ".github/workflows/Dalil_Syria_V1.4_DAMASCUS_RIF_BULK_READY.zip" -d v14
          unzip -q "Dalil_Syria_CLEAN_INSTALL_V1.2.1.zip" -d clean

      - name: Locate projects
        shell: bash
        run: |
          set -e

          SETTINGS=$(find v14 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS" || {
            echo "V1.4 Android project not found"
            exit 1
          }

          V14_ROOT=$(dirname "$SETTINGS")
          echo "V14_ROOT=$V14_ROOT" >> "$GITHUB_ENV"

          CLEAN_MOBILE=$(find clean -type d -path '*/mobile_app' -print -quit)
          test -n "$CLEAN_MOBILE" || {
            echo "Clean mobile_app not found"
            exit 1
          }

          echo "CLEAN_MOBILE=$CLEAN_MOBILE" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.4.0,<1.5"

      - name: Build and validate places
        shell: bash
        run: |
          set -e

          SCRIPT=$(find v14 -type f -path '*/tools/build_bulk_places.py' -print -quit)
          test -n "$SCRIPT" || {
            echo "Bulk builder not found"
            exit 1
          }

          PROJECT=$(dirname "$(dirname "$SCRIPT")")
          cd "$PROJECT"

          python tools/build_bulk_places.py --limit 10000

          test -s mobile_app/data/places.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("mobile_app/data/places.json")
          source = json.loads(p.read_text(encoding="utf-8"))

          if not isinstance(source, list):
              raise SystemExit("places.json is not a list")

          original_count = len(source)
          valid = []
          removed = []
          seen_ids = set()

          required = [
              "id",
              "name_ar",
              "name_en",
              "category_ar",
              "category_en",
              "latitude",
              "longitude"
          ]

          for index, place in enumerate(source):
              try:
                  if not isinstance(place, dict):
                      raise ValueError("record is not an object")

                  missing = [
                      key for key in required
                      if place.get(key) is None
                      or str(place.get(key)).strip() == ""
                  ]

                  if missing:
                      raise ValueError(
                          "missing required fields: " +
                          ",".join(missing)
                      )

                  pid = str(place["id"]).strip()

                  if pid in seen_ids:
                      raise ValueError("duplicate id: " + pid)

                  lat = float(place["latitude"])
                  lon = float(place["longitude"])

                  if not (-90 <= lat <= 90):
                      raise ValueError("invalid latitude")

                  if not (-180 <= lon <= 180):
                      raise ValueError("invalid longitude")

                  seen_ids.add(pid)
                  valid.append(place)

              except Exception as exc:
                  removed.append({
                      "index": index,
                      "id": place.get("id") if isinstance(place, dict) else None,
                      "reason": str(exc)
                  })

          if not valid:
              raise SystemExit("No valid places remain")

          p.write_text(
              json.dumps(valid, ensure_ascii=False),
              encoding="utf-8"
          )

          audit = Path("mobile_app/data/places_audit.json")

          audit.write_text(
              json.dumps(
                  {
                      "original_count": original_count,
                      "removed_count": len(removed),
                      "final_valid_count": len(valid),
                      "removed": removed
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("ORIGINAL_PLACE_COUNT =", original_count)
          print("REMOVED_INVALID_PLACES =", len(removed))
          print("FINAL_VALID_PLACE_COUNT =", len(valid))
          print("DATA_VALIDATION_OK")
          PY

          cp mobile_app/data/places.json "$GITHUB_WORKSPACE/places-v14.json"
          cp mobile_app/data/places_audit.json "$GITHUB_WORKSPACE/places-audit.json"

      - name: Restore complete mobile app
        shell: bash
        run: |
          set -e

          rm -rf "$V14_ROOT/mobile_app"

          cp -a "$CLEAN_MOBILE" "$V14_ROOT/mobile_app"

          cp "$GITHUB_WORKSPACE/places-v14.json" \
             "$V14_ROOT/mobile_app/data/places.json"

          cp "$GITHUB_WORKSPACE/places-audit.json" \
             "$V14_ROOT/mobile_app/data/places_audit.json"

          test -f "$V14_ROOT/mobile_app/index.html"
          test -f "$V14_ROOT/mobile_app/app.js"
          test -f "$V14_ROOT/mobile_app/styles.css"
          test -s "$V14_ROOT/mobile_app/data/places.json"

          echo "BASE_MOBILE_APP_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle local MapLibre
        shell: bash
        run: |
          set -e

          APP="$V14_ROOT/mobile_app"
          TMP="$RUNNER_TEMP/maplibre"

          rm -rf "$TMP"
          mkdir -p "$TMP" "$APP/vendor"

          cd "$TMP"

          npm init -y >/dev/null 2>&1
          npm install --silent maplibre-gl@6.10.0

          cp node_modules/maplibre-gl/dist/maplibre-gl.js \
             "$APP/vendor/maplibre-gl.js"

          cp node_modules/maplibre-gl/dist/maplibre-gl.css \
             "$APP/vendor/maplibre-gl.css"

          test -s "$APP/vendor/maplibre-gl.js"
          test -s "$APP/vendor/maplibre-gl.css"

          echo "LOCAL_MAPLIBRE_OK"

      - name: Bundle local place data
        shell: bash
        run: |
          set -e

          APP="$V14_ROOT/mobile_app"

          python - "$APP/data/places.json" "$APP/data/places.js" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])

          data = json.loads(
              source.read_text(encoding="utf-8")
          )

          if not isinstance(data, list) or not data:
              raise SystemExit("No place data available")

          target.write_text(
              "window.DALIL_PLACES=" +
              json.dumps(
                  data,
                  ensure_ascii=False,
                  separators=(",", ":")
              ) +
              ";",
              encoding="utf-8"
          )

          print("BUNDLED_PLACE_COUNT =", len(data))
          print("LOCAL_PLACE_DATA_OK")
          PY

          test -s "$APP/data/places.js"

      - name: Patch real application
        shell: bash
        run: |
          set -e

          APP="$V14_ROOT/mobile_app"

          python - "$APP/index.html" "$APP/app.js" <<'PY'
          from pathlib import Path
          import sys

          index = Path(sys.argv[1])
          app = Path(sys.argv[2])

          html = index.read_text(encoding="utf-8")
          js = app.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # LOCAL MAPLIBRE
          # ------------------------------------------------------------

          replacements = [
              (
                  '<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" crossorigin="">',
                  '<link rel="stylesheet" href="vendor/maplibre-gl.css">'
              ),
              (
                  '<script src="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.js" crossorigin=""></script>',
                  '<script src="vendor/maplibre-gl.js"></script>\n<script src="data/places.js"></script>'
              )
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(
                      "Required MapLibre source not found"
                  )
              html = html.replace(old, new, 1)

          # ------------------------------------------------------------
          # RESULTS SECTION
          # ------------------------------------------------------------

          if 'id="resultsSection"' not in html:

              insertion_points = [
                  '<section class="homeAfterMap">',
                  '<main',
                  '<body'
              ]

              inserted = False

              results = '''
<section id="resultsSection" class="resultsSection">
  <div class="sectionHead">
    <div>
      <h2 id="resultsTitle">الأماكن</h2>
      <p id="resultMeta">اختر تصنيفًا لعرض الأماكن</p>
    </div>
  </div>

  <div id="cards" class="cards">
    <div class="empty" id="resultsEmpty">
      اختر تصنيفًا أو ابحث عن مكان.
    </div>
  </div>
</section>
'''

              for marker in insertion_points:
                  if marker in html:
                      html = html.replace(
                          marker,
                          results + "\n" + marker,
                          1
                      )
                      inserted = True
                      break

              if not inserted:
                  raise SystemExit(
                      "Could not create results section"
                  )

          # ------------------------------------------------------------
          # LOCAL DATA
          # ------------------------------------------------------------

          old_data = (
              "async function ensureLocalData(){"
              "if(localPlaces.length)return localPlaces;"
              "const r=await fetch('./data/places.json',{cache:'no-store'});"
