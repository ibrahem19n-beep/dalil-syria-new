name: Dalil Syria 1.4 - Fixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V1.4
        shell: bash
        run: |
          set -e

          rm -rf v14 clean project

          mkdir -p v14 clean project

          unzip -q ".github/workflows/Dalil_Syria_V1.4_DAMASCUS_RIF_BULK_READY.zip" -d v14
          unzip -q "Dalil_Syria_CLEAN_INSTALL_V1.2.1.zip" -d clean

      - name: Locate projects
        shell: bash
        run: |
          set -e

          SETTINGS=$(find v14 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "V1.4 Android project not found"
            exit 1
          fi

          V14_ROOT=$(dirname "$SETTINGS")
          echo "V14_ROOT=$V14_ROOT" >> "$GITHUB_ENV"

          CLEAN_MOBILE=$(find clean -type d -path '*/mobile_app' -print -quit)

          if [ -z "$CLEAN_MOBILE" ]; then
            echo "Clean mobile_app not found"
            exit 1
          fi

          echo "CLEAN_MOBILE=$CLEAN_MOBILE" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.4.0,<1.5"

      - name: Build V1.4 data
        shell: bash
        run: |
          set -e

          SCRIPT=$(find "$V14_ROOT" -type f -path '*/tools/build_bulk_places.py' -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "Bulk builder not found"
            exit 1
          fi

          PROJECT=$(dirname "$(dirname "$SCRIPT")")

          cd "$PROJECT"

          python "$SCRIPT" --limit 10000

          test -s mobile_app/data/places.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("mobile_app/data/places.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("places.json is not a list")

          ids = [str(x.get("id")) for x in data]

          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate place IDs")

          for x in data:
              float(x["latitude"])
              float(x["longitude"])

          print("FINAL_PLACE_COUNT =", len(data))
          print("DATA_AUDIT_OK")
          PY

          cp mobile_app/data/places.json "$GITHUB_WORKSPACE/places-v14.json"

      - name: Restore complete mobile app UI
        shell: bash
        run: |
          set -e

          rm -rf "$V14_ROOT/mobile_app"

          cp -a "$CLEAN_MOBILE" "$V14_ROOT/mobile_app"

          cp "$GITHUB_WORKSPACE/places-v14.json" \
             "$V14_ROOT/mobile_app/data/places.json"

          test -f "$V14_ROOT/mobile_app/index.html"
          test -f "$V14_ROOT/mobile_app/app.js"
          test -f "$V14_ROOT/mobile_app/styles.css"
          test -s "$V14_ROOT/mobile_app/data/places.json"

          echo "COMPLETE MOBILE APP RESTORED"

      - name: Copy mobile app into Android assets
        shell: bash
        run: |
          set -e

          rm -rf "$V14_ROOT/android/app/src/main/assets/mobile_app"

          mkdir -p "$V14_ROOT/android/app/src/main/assets"

          cp -a "$V14_ROOT/mobile_app" \
             "$V14_ROOT/android/app/src/main/assets/mobile_app"

          test -f "$V14_ROOT/android/app/src/main/assets/mobile_app/index.html"
          test -f "$V14_ROOT/android/app/src/main/assets/mobile_app/app.js"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)
          fi

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true

          "$MANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          cd "$V14_ROOT/android"

          touch gradle.properties

          grep -q '^android.useAndroidX=true$' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=true$' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$V14_ROOT/android"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          APK=$(find "$V14_ROOT/android/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          cp "$APK" \
            apk-output/dalil-syria-v1.4-fixed-debug.apk

          cp "$V14_ROOT/mobile_app/data/places.json" \
            apk-output/places.json

          sha256sum apk-output/* > apk-output/SHA256SUMS.txt

          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-v1.4-fixed
          path: apk-output/*
          if-no-files-found: error
