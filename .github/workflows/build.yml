name: Dalil Syria 1.4 - Fixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V1.4
        shell: bash
        run: |
          set -e

          rm -rf v14 clean project

          mkdir -p v14 clean project

          unzip -q ".github/workflows/Dalil_Syria_V1.4_DAMASCUS_RIF_BULK_READY.zip" -d v14
          unzip -q "Dalil_Syria_CLEAN_INSTALL_V1.2.1.zip" -d clean

      - name: Locate projects
        shell: bash
        run: |
          set -e

          SETTINGS=$(find v14 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "V1.4 Android project not found"
            exit 1
          fi

          V14_ROOT=$(dirname "$SETTINGS")
          echo "V14_ROOT=$V14_ROOT" >> "$GITHUB_ENV"

          CLEAN_MOBILE=$(find clean -type d -path '*/mobile_app' -print -quit)

          if [ -z "$CLEAN_MOBILE" ]; then
            echo "Clean mobile_app not found"
            exit 1
          fi

          echo "CLEAN_MOBILE=$CLEAN_MOBILE" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.4.0,<1.5"

      - name: Build V1.4 Damascus and Rif data
        shell: bash
        run: |
          set -e

          SCRIPT=$(find v14 -type f -path '*/tools/build_bulk_places.py' -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "Bulk builder not found"
            exit 1
          fi

          PROJECT=$(dirname "$(dirname "$SCRIPT")")

          cd "$PROJECT"

          python tools/build_bulk_places.py --limit 10000

          test -s mobile_app/data/places.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("mobile_app/data/places.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("places.json is not a list")

          ids = [str(x.get("id")) for x in data]

          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate place IDs")

          for x in data:
              float(x["latitude"])
              float(x["longitude"])

          print("FINAL_PLACE_COUNT =", len(data))
          print("DATA_AUDIT_OK")
          PY

          cp mobile_app/data/places.json "$GITHUB_WORKSPACE/places-v14.json"

      - name: Restore complete mobile app UI
        shell: bash
        run: |
          set -e

          rm -rf "$V14_ROOT/mobile_app"

          cp -a "$CLEAN_MOBILE" "$V14_ROOT/mobile_app"

          cp "$GITHUB_WORKSPACE/places-v14.json" \
             "$V14_ROOT/mobile_app/data/places.json"

          test -f "$V14_ROOT/mobile_app/index.html"
          test -f "$V14_ROOT/mobile_app/app.js"
          test -f "$V14_ROOT/mobile_app/styles.css"
          test -f "$V14_ROOT/mobile_app/manifest.webmanifest"
          test -f "$V14_ROOT/mobile_app/sw.js"
          test -s "$V14_ROOT/mobile_app/data/places.json"

          echo "COMPLETE MOBILE APP RESTORED"

      - name: Verify map and language assets
        shell: bash
        run: |
          set -e

          APP="$V14_ROOT/mobile_app"

          test -f "$APP/index.html"
          test -f "$APP/app.js"

          grep -qi "maplibre" "$APP/index.html" "$APP/app.js"
          grep -qi "openfreemap" "$APP/index.html" "$APP/app.js"

          grep -qi "langToggle\|dalil_lang\|FULL_I18N\|I18N" \
            "$APP/index.html" "$APP/app.js"

          echo "MAP_CODE_PRESENT"
          echo "LANGUAGE_CODE_PRESENT"

      - name: Copy mobile app into Android assets
        shell: bash
        run: |
          set -e

          rm -rf "$V14_ROOT/app/src/main/assets/mobile_app"

          mkdir -p "$V14_ROOT/app/src/main/assets"

          cp -a "$V14_ROOT/mobile_app" \
             "$V14_ROOT/app/src/main/assets/mobile_app"

          test -f "$V14_ROOT/app/src/main/assets/mobile_app/index.html"
          test -f "$V14_ROOT/app/src/main/assets/mobile_app/app.js"
          test -s "$V14_ROOT/app/src/main/assets/mobile_app/data/places.json"

      - name: Ensure Android internet permission
        shell: bash
        run: |
          set -e

          MANIFEST="$V14_ROOT/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            python - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          marker = "<application"
          pos = s.find(marker)

          if pos == -1:
              raise SystemExit("application tag not found")

          s = s[:pos] + permission + s[pos:]
          p.write_text(s, encoding="utf-8")
          PY
          fi

          grep -q 'android.permission.INTERNET' "$MANIFEST"

          echo "INTERNET_PERMISSION_OK"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)
          fi

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true

          "$MANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          cd "$V14_ROOT"

          touch gradle.properties

          grep -q '^android.useAndroidX=true$' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=true$' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$V14_ROOT"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Validate APK structure and signature
        shell: bash
        run: |
          set -e

          APK=$(find "$V14_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK=$APK"

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          ZIPALIGN="$SDK/build-tools/35.0.0/zipalign"
          APKSIGNER="$SDK/build-tools/35.0.0/apksigner"
          AAPT2="$SDK/build-tools/35.0.0/aapt2"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -c -P 4 -v 4 "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --min-sdk-version 23 \
            "$APK"

          "$AAPT2" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -q '^package:' "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q '^application-label:' "$GITHUB_WORKSPACE/apk-badging.txt"

          echo "APK_STRUCTURE_OK"
          echo "APK_SIGNATURE_OK"
          echo "APK_BADGING_OK"

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          APK=$(find "$V14_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          cp "$APK" \
            apk-output/dalil-syria-v1.4-fixed-debug.apk

          cp "$V14_ROOT/mobile_app/data/places.json" \
            apk-output/places.json

          cp "$GITHUB_WORKSPACE/apk-badging.txt" \
            apk-output/apk-badging.txt

          sha256sum apk-output/dalil-syria-v1.4-fixed-debug.apk \
            > apk-output/SHA256SUMS.txt

          ls -lh apk-output

      - name: Final APK verification
        shell: bash
        run: |
          set -e

          APK="apk-output/dalil-syria-v1.4-fixed-debug.apk"

          test -s "$APK"

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK/build-tools/35.0.0/apksigner"
          ZIPALIGN="$SDK/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" -c -P 4 -v 4 "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --min-sdk-version 23 \
            "$APK"

          echo "FINAL_APK_VERIFIED_OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-v1.4-fixed
          path: apk-output/*
          if-no-files-found: error
