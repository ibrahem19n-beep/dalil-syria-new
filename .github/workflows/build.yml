function realPlaceText(place){
  return [
    place.name_ar,
    place.name_en,
    place.category_ar,
    place.category_en,
    place.address_ar,
    place.address_en,
    ...(Array.isArray(place.aliases)
      ? place.aliases
      : [])
  ]
  .filter(Boolean)
  .join(' ')
  .toLowerCase();
}

function realCategoryMatch(place,key){
  const terms=REAL_CATEGORY_MAP[key]||[];
  const text=realPlaceText(place);

  return terms.some(term =>
    text.includes(String(term).toLowerCase())
  );
}

function escapeRealHtml(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function getRealPlaceName(place){
  return uiLang==='en'
    ?(place.name_en||place.name_ar||'')
    :(place.name_ar||place.name_en||'');
}

function getRealCategoryName(place){
  return uiLang==='en'
    ?(place.category_en||place.category_ar||'')
    :(place.category_ar||place.category_en||'');
}

function getRealAddress(place){
  return uiLang==='en'
    ?(place.address_en||place.address_ar||'')
    :(place.address_ar||place.address_en||'');
}

function renderRealResults(list,title){

  const cards=document.querySelector('#cards');
  const meta=document.querySelector('#resultMeta');
  const heading=document.querySelector('#resultsTitle');

  if(!cards)return;

  if(heading){
    heading.textContent=
      title ||
      (uiLang==='en'?'Places':'الأماكن');
  }

  if(meta){
    meta.textContent=
      `${list.length} ${uiLang==='en'?'places':'مكان'}`;
  }

  if(!list.length){

    cards.innerHTML=
      `<div class="empty" id="resultsEmpty">${
        uiLang==='en'
          ?'No places found in this category.'
          :'لا توجد أماكن مطابقة لهذا التصنيف.'
      }</div>`;

    return;
  }

  cards.innerHTML=list
    .slice(0,100)
    .map((place,index)=>`
      <button
        type="button"
        class="placeCard"
        data-real-place="${index}">
        <strong>${escapeRealHtml(getRealPlaceName(place))}</strong>
        <span>${escapeRealHtml(getRealCategoryName(place))}</span>
        <small>${escapeRealHtml(getRealAddress(place))}</small>
      </button>
    `)
    .join('');

  [
    ...cards.querySelectorAll('[data-real-place]')
  ].forEach((element,index)=>{

    element.onclick=()=>{
      const place=list[index];

      if(typeof openPlace==='function'){
        try{
          openPlace(place);
          return;
        }catch(error){
          console.error(
            'openPlace failed',
            error
          );
        }
      }

      showRealPlaceFallback(place);
    };
  });
}

function showRealPlaceFallback(place){

  const name=getRealPlaceName(place);
  const category=getRealCategoryName(place);
  const address=getRealAddress(place);

  const phone=place.phone||'';

  const existing=
    document.querySelector('#realPlaceFallback');

  if(existing)existing.remove();

  const wrapper=document.createElement('div');

  wrapper.id='realPlaceFallback';
  wrapper.className='modal';

  wrapper.innerHTML=`
    <div class="modalCard">
      <button
        type="button"
        class="modalClose"
        aria-label="Close">×</button>

      <h2>${escapeRealHtml(name)}</h2>

      <p>${escapeRealHtml(category)}</p>

      <p>${escapeRealHtml(address)}</p>

      ${
        phone
          ? `<p>${escapeRealHtml(phone)}</p>`
          :''
      }

      ${
        place.latitude!=null &&
        place.longitude!=null
          ? `<button
               type="button"
               id="realPlaceMapButton">
               ${uiLang==='en'
                 ?'Show on map'
                 :'عرض على الخريطة'}
             </button>`
          :''
      }
    </div>
  `;

  document.body.appendChild(wrapper);

  const close=wrapper.querySelector('.modalClose');

  if(close){
    close.onclick=()=>wrapper.remove();
  }

  const mapButton=
    wrapper.querySelector('#realPlaceMapButton');

  if(mapButton){

    mapButton.onclick=()=>{

      wrapper.remove();

      if(window.map &&
         typeof window.map.flyTo==='function'){

        window.map.flyTo({
          center:[
            Number(place.longitude),
            Number(place.latitude)
          ],
          zoom:15
        });
      }
    };
  }
}

async function focusRealCategory(key,label){

  const all=await ensureLocalData();

  const filtered=all.filter(
    place=>realCategoryMatch(place,key)
  );

  renderRealResults(
    filtered,
    label
  );

  if(
    typeof plot==='function' &&
    window.map &&
    filtered.length
  ){
    try{
      plot(filtered);
    }catch(error){
      console.error(
        'Category map plot failed',
        error
      );
    }
  }

  if(
    window.map &&
    filtered.length
  ){

    const first=filtered.find(
      place=>
        place.latitude!=null &&
        place.longitude!=null
    );

    if(first){

      window.map.flyTo({
        center:[
          Number(first.longitude),
          Number(first.latitude)
        ],
        zoom:11
      });
    }
  }

  return filtered;
}

window.REAL_CATEGORY_MAP=
  REAL_CATEGORY_MAP;

window.focusRealCategory=
  focusRealCategory;

window.showRealPlaceFallback=
  showRealPlaceFallback;
'''

