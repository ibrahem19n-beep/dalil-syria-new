name: Dalil Syria Clean APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android components
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)
          fi

          test -n "$MANAGER"

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true

          "$MANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and Extract Clean Package
        shell: bash
        run: |
          ZIP_NAME="Dalil_Syria_CLEAN_INSTALL_V1.2.1.zip"
          ZIP_PATH=$(find . -type f -name "$ZIP_NAME" -print -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: $ZIP_NAME not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

      - name: Locate Android Project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX
        shell: bash
        run: |
          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q '^android.useAndroidX=true$' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output

          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo 'ERROR: APK was not generated.'
            exit 1
          fi

          cp "$APK" apk-output/dalil-syria-v1.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dalil-syria-v1.2.0
          path: apk-output/dalil-syria-v1.2.0-debug.apk
          if-no-files-found: error
